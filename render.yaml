services:
  # ---------------------------------------------------------------
  # AWS emulator. In-process services only on Render (no Docker
  # socket) — Lambda/RDS/ECS/EKS/EC2/MSK/OpenSearch/Athena will
  # fail if called. S3, DynamoDB, SQS, SNS, IAM, KMS, STS,
  # CloudFormation, Secrets Manager, EventBridge, Step Functions,
  # SSM, API Gateway, Cognito, etc. all work normally.
  #
  # Free tier: no persistent disk support, so storage is ephemeral —
  # emulator state resets on every restart/redeploy. Fine for
  # dev/testing; switch to plan: starter + a disk: block for
  # persistence across restarts.
  # ---------------------------------------------------------------
  - type: web
    name: floci-aws
    env: image
    image:
      url: docker.io/floci/floci:latest
    plan: free
    envVars:
      - key: PORT
        value: 4566
      - key: FLOCI_STORAGE_MODE
        value: memory
      - key: FLOCI_HOSTNAME
        value: floci-aws.onrender.com
      - key: FLOCI_DEFAULT_REGION
        value: us-east-1

  # ---------------------------------------------------------------
  # Azure emulator. Fully functional on Render — no Docker socket
  # dependency for any of its services.
  # ---------------------------------------------------------------
  - type: web
    name: floci-az
    env: image
    image:
      url: docker.io/floci/floci-az:latest
    plan: free
    envVars:
      - key: PORT
        value: 4577
      - key: FLOCI_STORAGE_MODE
        value: ephemeral
      - key: FLOCI_HOSTNAME
        value: floci-az.onrender.com

  # ---------------------------------------------------------------
  # GCP emulator. Fully functional on Render — no Docker socket
  # dependency for any of its services.
  # ---------------------------------------------------------------
  - type: web
    name: floci-gcp
    env: image
    image:
      url: docker.io/floci/floci-gcp:latest
    plan: free
    envVars:
      - key: PORT
        value: 4588
      - key: FLOCI_STORAGE_MODE
        value: ephemeral
      - key: FLOCI_HOSTNAME
        value: floci-gcp.onrender.com
      - key: CLOUDSDK_CORE_PROJECT
        value: floci-local

  # ---------------------------------------------------------------
  # OCI emulator. In-process services only on Render — Functions
  # will fail without a Docker socket. Object Storage, Identity,
  # Queue, Streaming, KMS, Vault all work normally.
  # ---------------------------------------------------------------
  - type: web
    name: floci-oci
    env: image
    image:
      url: docker.io/floci/floci-oci:latest
    plan: free
    envVars:
      - key: PORT
        value: 4599
      - key: FLOCI_STORAGE_MODE
        value: ephemeral
      - key: FLOCI_HOSTNAME
        value: floci-oci.onrender.com

  # ---------------------------------------------------------------
  # Floci UI. Single combined image (API + built frontend on one
  # port) — see floci-io/floci-ui docker/Dockerfile. Points at the
  # AWS, Azure, and GCP emulator services above. Update the
  # *_ENDPOINT values below if Render assigns different hostnames
  # than the ones already in floci-env.sh / floci-az-env.sh.
  # ---------------------------------------------------------------
  - type: web
    name: floci-ui
    env: image
    image:
      url: docker.io/floci/floci-ui:latest
    plan: free
    envVars:
      - key: PORT
        value: 4500
      - key: FLOCI_ENDPOINT
        value: https://floci-aws-gsnc.onrender.com
      - key: FLOCI_AZURE_ENDPOINT
        value: https://floci-az-gsnc.onrender.com
      - key: FLOCI_AZURE_ACCOUNT_NAME
        value: devstoreaccount1
      - key: FLOCI_GCP_ENDPOINT
        value: https://floci-gcp-gsnc.onrender.com
      - key: FLOCI_GCP_PROJECT
        value: floci-local
      - key: AWS_REGION
        value: us-east-1
      - key: AWS_ACCESS_KEY_ID
        value: test
      - key: AWS_SECRET_ACCESS_KEY
        value: test
